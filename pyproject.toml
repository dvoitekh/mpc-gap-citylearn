[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpcgap"
version = "1.0.0"
description = "Perfect-foresight LP, online stochastic MPC and forecasters for the CityLearn 2022 benchmark"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Dmytro Voitekh"}, {name = "Anatolii Tymoshenko"}]

[tool.setuptools]
packages = ["mpcgap"]
